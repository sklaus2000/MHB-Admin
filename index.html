<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mountain Health Bar Admin</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            Mountain Health Bar

            <span>Admin Dashboard</span>

        </div>

        <nav>

            <a class="active">Dashboard</a>

            <a>Menu</a>

            <a>Opening Hours</a>

            <a>QR Codes</a>

            <a>Statistics</a>

            <a>Settings</a>

        </nav>

    </aside>

    <main class="content">

  <section class="dashboard-grid">

    <article class="dashboard-card">

        <span class="card-label">Today's Requests</span>

        <strong class="card-value">12</strong>

        <span class="card-note">All guest requests today</span>

    </article>

    <article class="dashboard-card">

        <span class="card-label">Service Calls</span>

        <strong class="card-value">8</strong>

        <span class="card-note">Requests sent to the service team</span>

    </article>

    <article class="dashboard-card">

        <span class="card-label">Fresh Towels</span>

        <strong class="card-value">4</strong>

        <span class="card-note">Requests sent to the spa team</span>

    </article>

    <article class="dashboard-card status-card">

        <span class="card-label">Service Status</span>

        <strong class="status-value">

            <span class="status-dot"></span>

            Open

        </strong>

        <span class="card-note">Available from 11:00 to 17:00</span>

    </article>

</section>

    </main>

</div>

<script src="js/app.js"></script>

</body>

</html>
